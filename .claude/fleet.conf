# What the fleet protocol needs to know about this project.
# Sourced by ~/.claude/scripts/fleet.sh; everything else about the protocol is
# generic and lives there.

# The roles this project runs. The script only checks a worktree has declared
# one of them; what each may change is in CLAUDE.md.
ROLES="tester architect feature"

# Tests, and everything else worth running before handing work back. Separate,
# because a merge that passes tests is not necessarily one that compiles.
SUITE="npm test"
CHECKS="npm run typecheck && npx oxlint src"

# node_modules is git-ignored, so a fresh worktree cannot run a single npm
# script until this is back.
BOOTSTRAP_DIR="node_modules"
BOOTSTRAP_CMD="npm install --no-audit --no-fund"
